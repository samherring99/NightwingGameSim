[pytest]
# Pytest configuration for NightwingGameSim

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test paths
testpaths = tests

# Markers
markers =
    integration: Integration tests (may be slow)
    requires_gbdk: Tests requiring GBDK installation
    requires_api_key: Tests requiring API keys

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term
